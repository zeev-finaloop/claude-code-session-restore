name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: npx --yes @vscode/vsce@3.6.0 package -o ext.vsix
      - run: npx --yes @vscode/vsce@3.6.0 publish --packagePath ext.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: npx --yes ovsx@0.10.1 publish ext.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

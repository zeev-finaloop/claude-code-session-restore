name: release

# On a v* tag: test, package, and attach the .vsix to the GitHub release.
# Upload that .vsix to the VS Code Marketplace by hand
# (marketplace.visualstudio.com/manage/publishers/szeevs → ⋯ → Update).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: npx --yes @vscode/vsce@3.6.0 package -o "claude-code-session-restore-${GITHUB_REF_NAME#v}.vsix"
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload "$GITHUB_REF_NAME" *.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
